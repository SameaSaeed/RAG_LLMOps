apiVersion: v1
kind: Namespace
metadata:
  name: llmops
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llmops-config
  namespace: llmops
data:
  ENV: "production"
  LOG_LEVEL: "INFO"
  API_PORT: "8000"
  UI_PORT: "8501"
  PYTHONUNBUFFERED: "1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: llmops
data:
  config.yaml: |
    data_source:
      type: file
    text_splitter:
      chunk_size: 1000
      chunk_overlap: 200
    embedding_model:
      model_name: sentence-transformers/all-MiniLM-L6-v2
    vector_store:
      type: cassandra
    retriever:
      search_type: mmr
      k: 5
      fetch_k: 20
      lambda_mult: 0.5
    llm:
      provider: groq
      model_name: llama-3.3-70b-versatile
      temperature: 0
