apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llmops-ingress
  namespace: llmops
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  tls:
    - hosts:
        - llmops.example.com
      secretName: llmops-tls
  rules:
    - host: llmops.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: llmops-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llmops-ui
                port:
                  number: 8501
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llmops-network-policy
  namespace: llmops
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
  egress:
    - to:
        - namespaceSelector: {}
    - to:
        - podSelector:
            matchLabels: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
