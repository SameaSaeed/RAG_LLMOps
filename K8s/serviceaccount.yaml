apiVersion: v1
kind: ServiceAccount
metadata:
  name: llmops-sa
  namespace: llmops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llmops-role
  namespace: llmops
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "pods/logs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llmops-rolebinding
  namespace: llmops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llmops-role
subjects:
  - kind: ServiceAccount
    name: llmops-sa
    namespace: llmops
