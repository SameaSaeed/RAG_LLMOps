version: '3.8'

services:
  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llmops-api
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - GROQ_API_KEY=${GROQ_API_KEY:-your-key-here}
      - ASTRA_DB_APPLICATION_TOKEN=${ASTRA_DB_APPLICATION_TOKEN:-your-token-here}
      - ASTRA_DB_ID=${ASTRA_DB_ID:-your-db-id-here}
    volumes:
      - ./:/app
      - logs:/app/logs
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - llmops-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - redis

  # Streamlit UI
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llmops-ui
    ports:
      - "8501:8501"
    environment:
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/app
    command: streamlit run ui.py --server.port 8501 --server.address 0.0.0.0
    networks:
      - llmops-network
    depends_on:
      - api

  # Redis (optional, for caching)
  redis:
    image: redis:7-alpine
    container_name: llmops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - llmops-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Optional: Adminer for database inspection
  adminer:
    image: adminer:latest
    container_name: llmops-adminer
    ports:
      - "8080:8080"
    networks:
      - llmops-network
    environment:
      - ADMINER_DEFAULT_SERVER=redis

networks:
  llmops-network:
    driver: bridge

volumes:
  logs:
  redis_data:
